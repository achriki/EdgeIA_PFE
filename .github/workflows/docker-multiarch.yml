# Triggered on every push to main.
# Jobs:
#   1. test: run pytest (unit + functional) on amd64
#   2. build: build multi-arch image and push to Docker Hub
#   3. deploy: SSH into Pi and trigger K3s rolling update
#
# Secrets required (set in GitHub repo Settings - Secrets):
#   DOCKER_HUB_USERNAME
#   DOCKER_HUB_TOKEN: Access Token, not your password
#   PI_HOST: Pi's local IP
#   PI_USER: SSH username (e.g. pi)
#   PI_SSH_KEY: private key (public key must be on Pi)

name: CI - Build . Test . Push . deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/edgeia-person-detector

jobs:
  # job 1: run pytest on the amd64 runner
  # Runs before building the image so we don't push a broken model
  test:
    name: Pytest (unit + functional)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip  # caches pip downloads between runs
      
      - name: Install dependencies
        run: pip install -r docker/requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/unit/ -v

      - name: Run functional inference tests
        run: pytest tests/functional/ -v


  # job 2: Build multi-arch image and push to Docker Hub
  # only runs after tests pass (needs: test)
  # only pushes on main branch (not on PRs)
  build:
    name: Build multi-arch image
    runs-on: ubuntu-latest
    needs: test # waits until test jon succeed

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU (for ARM emulation)
        uses: docker/setup-qemu-actions@v3
        with:
          platform: arm 
      
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3
      
      # Authenticate with docker hub using stored secrets
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'   # skip on PRs
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      # Compute the image tags: -always tag as latest; -tag as the short Git SHA; -allows precise rollback in K3s
      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      
      # The actual multi-arch build + push
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm/v7
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          # cache-from/to: reuse BuildKit cache between runs
          # This makes rebuilds ~3x faster when only app code changed
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
    # job 3: SSH into Pi and trigger K3s rolling update
    # Only runs after a successful image push (needs: build).
    # Only runs on main (not PRs).
    deploy:
      name: Deploy to Raspberry Pi (K3s)
      runs-on: ubuntu-latest
      needs: build
      if: github.ref == 'refs/heads/main'

      steps:
        - name: SSH into Pi and trigger rolling update
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.PI_HOST }}
            username: ${{ secrets.PI_USER }}
            key: ${{ secrets.PI_SSH_KEY }}
            script: |
              # Pull the new image on the Pi
              # K3s can also do this automatically - but explicit pullensures the Pi has the image before restarting pods
              docker pull ${{env.IMAGE}}:latest

              # Apply the K3s deployment manifest.
              # If the image tag changed, K3s will do a rolling update:
              #   1. Start new pod with new image
              #   2. Wait for it to be Ready (health check passes)
              #   3. Terminate the old pod
              # If the new pod fails health checks, K3s rolls back automatically.
              kubectl apply -f /home/pi/k8s/deployment.yaml
              kubectl rollout status deployment/person-detector --timeout=120s