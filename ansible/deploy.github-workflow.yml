# This workflow is triggered automatically after a push to the main branch.
# It builds and pushes the Docker image, then triggers `deploy_model.yml` via SSH.

name: "Build → Push → Deploy on Edge"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag d'image à déployer (ex: v2, latest)"
        required: false
        default: "latest"

env:
  DOCKER_IMAGE: achriki/edgeia-person-detector
  IMAGE_TAG: ${{ github.sha }}   # Commit SHA = unique and traceable tag

jobs:
  # Job1: Build + Push
  build-and-push:
    name: "Build & Push Docker image"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx (multi-arch)
        uses: docker/setup-buildx-action@v3

      - name: Build and push (ARM + x86)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm/v7,linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest
    
    # Job 2: Deploy via Ansible
    deploy:
      name: "Deploy to edge cluster (Ansible)"
    runs-on: ubuntu-latest
    needs: build-and-push # waiting for the build to finish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible on runner
        run: pip install ansible

      - name: Add Pi SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PI_HOST }} >> ~/.ssh/known_hosts

      - name: Run deploy_model.yml
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy_model.yml \
            -e "image_tag=${{ env.IMAGE_TAG }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed for tag ${{ env.IMAGE_TAG }} - rollback has been triggered automatically"