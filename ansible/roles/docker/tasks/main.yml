---
# =============================================================================
# roles/docker/tasks/main.yml
# Installation of Docker CE for ARM (Pi 3B = linux/arm/v7)
# Official Docker method: Add the distro's apt repository, not docker.io
# =============================================================================

- name: "Docker | Remove old Docker packages if present"
  ansible.builtin.apt:
    name:
      - docker
      - docker-engine
      - docker.io
      - containerd
      - runc
    state: absent

- name: "Docker | Create the repo for the GPG key"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: "Docker | Download the official Docker GPG key"
  ansible.builtin.shell:
    cmd: >
      curl -fsSL https://download.docker.com/linux/raspbian/gpg |
      gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    creates: /etc/apt/keyrings/docker.gpg   # idempotent : Do not download again if already present

- name: "Docker | Add the Docker ARM repository"
  ansible.builtin.apt_repository:
    repo: >
      deb [arch=armhf signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/raspbian
      bookworm stable
    state: present
    filename: docker
    
- name: "Docker | Update the apt cache after adding the repository"
  ansible.builtin.apt:
    update_cache: true

- name: "Docker | Installing Docker CE and its plugins"
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  notify: restart_docker

- name: "Docker | Add the pi user to the docker group"
  ansible.builtin.user:
    name: "{{ pi_user }}"
    groups: docker
    append: true

- name: "Docker | Enable and start the Docker service"
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: "Docker | Check if Docker is responding"
  ansible.builtin.command:
    cmd: docker info
  changed_when: false
  register: docker_info
  failed_when: docker_info.rc != 0
