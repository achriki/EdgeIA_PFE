---
# =============================================================================
# roles/node_exporter/tasks/main.yml
# Installing Prometheus Node Exporter for ARM (Raspberry Pi 3B)
# Exposes system metrics on port 9100
# Used by T20 (Prometheus scraping) and T21 (Grafana dashboard)
# =============================================================================

- name: "NodeExporter | Check if already installed"
  ansible.builtin.stat:
    path: /usr/local/bin/node_exporter
  register: node_exp_binary

- name: "NodeExporter | Create the node_exporter system user"
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  when: not node_exp_binary.stat.exists

- name: "NodeExporter | Set the archive name"
  ansible.builtin.set_fact:
    node_exporter_archive: >-
      node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz

- name: "NodeExporter | Download Node Exporter {{ node_exporter_version }}"
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/{{ node_exporter_archive }}"
    dest: "/tmp/{{ node_exporter_archive }}"
    mode: "0644"
  when: not node_exp_binary.stat.exists

- name: "NodeExporter | Extract archive"
  ansible.builtin.unarchive:
    src: "/tmp/{{ node_exporter_archive }}"
    dest: /tmp/
    remote_src: true
  when: not node_exp_binary.stat.exists

- name: "NodeExporter | Copy the binary to /usr/local/bin"
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    owner: node_exporter
    group: node_exporter
    mode: "0755"
    remote_src: true
  when: not node_exp_binary.stat.exists
  notify: restart_node_exporter

- name: "NodeExporter | Deploy the systemd service"
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify:
    - reload_systemd
    - restart_node_exporter

- name: "NodeExporter | Enable and Start node_exporter"
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: "NodeExporter | Verify that port 9100 is open"
  ansible.builtin.wait_for:
    port: "{{ node_exporter_port }}"
    host: "127.0.0.1"
    timeout: 30

- name: "NodeExporter | Test HTTP /metrics"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ node_exporter_port }}/metrics"
    method: GET
    status_code: 200
  register: metrics_check
  changed_when: false

- name: "NodeExporter | Résultat"
  ansible.builtin.debug:
    msg: "Node Exporter respond on :{{ node_exporter_port }} — {{ metrics_check.status }}"
