# Tells Grafana where to look for dashboard JSON files

apiVersion: 1

providers:
  - name: 'EdgeIA Dashboards'
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false