# ./prometheus.yml
# Prometheus Configuration - Scrapes the Raspberry Pi (raspEdge)

global:
  scrape_interval: 15s   # every 15 seconds
  evaluation_interval: 15s
  external_labels:
    project: 'edgeia-pfe'
    environment: 'edge'

# Scrape targets
scrape_configs:

  # Prometheus se scrape lui-même (métriques internes)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  
  # System metrics: CPU, RAM, disk, network, SoC temperature
  # Port 9100 exposed directly by the systemd service (excluding K3s)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['192.168.100.15:9100']
        labels:
          instance: 'raspEdge'
          role: 'edge-node'
  
  # Application metrics: latency, detections, requests
  # Exposed via NodePort 30080 on the K3s cluster
  - job_name: 'inference-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.100.15:30080']
        labels:
          instance: 'raspEdge'
          role: 'inference'
          model: 'edgeai-FP16'