[pytest]

# Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output
addopts = 
    -v
    --tb=short
    --strict-markers

# Custom markers
markers = 
    unit: Pure unit tests — no model inference required
    functional: Inference correctness tests
    performance: mAP / precision / recall threshold tests
    edge: Latency and resource tests (run on Raspberry Pi)
    integration: Pipeline integration tests
    slow: Tests that take > 30 seconds (excluded from fast CI runs)